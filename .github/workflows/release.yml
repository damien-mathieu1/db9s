name: Release binaries

# Called by create-release.yml once the tag and the GitHub Release exist.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }  # cross-compiled: Intel runners are retired
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=db9s-${{ inputs.tag }}-${{ matrix.target }}
          mkdir "$name"
          cp README.md LICENSE "$name/"
          if [[ "${{ matrix.os }}" == windows-latest ]]; then
            cp target/${{ matrix.target }}/release/db9s.exe "$name/"
            7z a "$name.zip" "$name"
          else
            cp target/${{ matrix.target }}/release/db9s "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: db9s-*.*

  # The desktop app, macOS only for now: db9s.app zipped per arch, for the cask.
  gui-macos:
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]  # x86_64 cross-compiled
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p db9s-gui --target ${{ matrix.target }}
      - run: dev/macos-app.sh ${{ matrix.target }} ${{ inputs.tag }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: db9s-gui-*.zip

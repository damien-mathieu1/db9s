[package]
name = "db9s"
version = "0.1.1"
edition = "2021"
description = "k9s-style terminal UI to browse, query, and edit Postgres, MongoDB and RabbitMQ"
license = "MIT"
repository = "https://github.com/damien-mathieu1/db9s"
readme = "README.md"
keywords = ["tui", "postgres", "mongodb", "rabbitmq", "database"]
categories = ["command-line-utilities", "database"]
exclude = ["dev/", "docker-compose.yml", ".github/"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
mongodb = { version = "3", features = ["rustls-tls"] }
bson = { version = "2", features = ["serde_with-3", "chrono-0_4"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
anyhow = "1"
async-trait = "0.1"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
directories = "5"
chrono = "0.4"
uuid = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
lapin = { version = "4", default-features = false, features = ["tokio", "rustls--ring", "rustls-webpki-roots-certs"] }

[profile.release]
lto = true

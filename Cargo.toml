[workspace]
members = ["crates/db9s-core", "crates/db9s-gui"]
# the GUI (GPUI) is slow to build and needs system libs on Linux: opt in with -p db9s-gui
default-members = [".", "crates/db9s-core"]

[workspace.package]
version = "2026.11.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/damien-mathieu1/db9s"

[package]
name = "db9s"
version.workspace = true
edition.workspace = true
description = "k9s-style terminal UI to browse, query, and edit Postgres, MySQL, MongoDB, Redis and RabbitMQ"
license = "MIT"
repository = "https://github.com/damien-mathieu1/db9s"
readme = "README.md"
keywords = ["tui", "postgres", "mongodb", "redis", "rabbitmq"]
categories = ["command-line-utilities", "database"]
exclude = ["dev/", "docker-compose.yml", ".github/"]

[dependencies]
# exact pin: both crates are always released together, at the same version
db9s-core = { path = "crates/db9s-core", version = "=2026.11.3" }
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
anyhow = "1"
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = true

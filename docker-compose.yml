services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: db9s
      POSTGRES_PASSWORD: db9s
      POSTGRES_DB: db9s
    ports:
      - "55432:5432"
    volumes:
      - ./dev/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: db9s
      MYSQL_DATABASE: db9s
      MYSQL_USER: db9s
      MYSQL_PASSWORD: db9s
    ports:
      - "53306:3306"
    volumes:
      - ./dev/seed-mysql.sql:/docker-entrypoint-initdb.d/seed.sql:ro

  mongo:
    image: mongo:7
    ports:
      - "57017:27017"
    volumes:
      - ./dev/seed.js:/docker-entrypoint-initdb.d/seed.js:ro

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: db9s
      RABBITMQ_DEFAULT_PASS: db9s
    ports:
      - "55672:15672"
      - "55673:5672"

  rabbitmq-seed:
    image: curlimages/curl:8.11.1
    depends_on: [rabbitmq]
    volumes:
      - ./dev/seed-rabbitmq.sh:/seed.sh:ro
    entrypoint: ["sh", "/seed.sh"]

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"

  redis-seed:
    image: redis:7-alpine
    depends_on: [redis]
    volumes:
      - ./dev/seed-redis.sh:/seed.sh:ro
    entrypoint: ["sh", "/seed.sh"]

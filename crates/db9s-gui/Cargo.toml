[package]
name = "db9s-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Desktop (GPUI) frontend of db9s: same screens and keys as the TUI"
publish = false

[dependencies]
db9s-core = { path = "../db9s-core" }
# runtime_shaders: no Xcode Metal Toolchain needed to build (shaders compile at startup)
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
serde_json = { version = "1", features = ["preserve_order"] }

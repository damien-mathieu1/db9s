[package]
name = "db9s-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "UI-agnostic core of db9s: database backends, config, secrets and app state"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "mysql", "sqlite", "chrono", "uuid", "json", "rust_decimal"] }
mongodb = { version = "3", features = ["rustls-tls"] }
bson = { version = "2", features = ["serde_with-3", "chrono-0_4"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
anyhow = "1"
async-trait = "0.1"
futures-util = "0.3"
directories = "5"
chrono = "0.4"
uuid = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
lapin = { version = "4", default-features = false, features = ["tokio", "rustls--ring", "rustls-webpki-roots-certs"] }
redis = { version = "1.8", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "tls-rustls-webpki-roots", "streams"] }
